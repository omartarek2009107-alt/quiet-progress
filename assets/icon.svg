<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Quiet Progress</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0"   stop-color="#1b2b47"/>
      <stop offset="0.55" stop-color="#101a2c"/>
      <stop offset="1"   stop-color="#080c15"/>
    </linearGradient>

    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2ee6c5"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Bloom on the check, echoing the glow used throughout the dashboard. -->
    <filter id="bloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Tile -->
  <rect width="256" height="256" rx="58" fill="url(#tile)"/>
  <rect x="2" y="2" width="252" height="252" rx="56" fill="none"
        stroke="#2ee6c5" stroke-opacity="0.26" stroke-width="4"/>

  <!-- Habit grid, the app's own motif. Deliberately low contrast: it reads as
       texture at 256px and dissolves to a flat ground at 16px. -->
  <g opacity="0.85">
    <!-- row 1 : done -->
    <rect x="42"  y="46" width="30" height="30" rx="8" fill="#2ee6c5" fill-opacity="0.30"/>
    <rect x="86"  y="46" width="30" height="30" rx="8" fill="#2ee6c5" fill-opacity="0.30"/>
    <rect x="130" y="46" width="30" height="30" rx="8" fill="#2ee6c5" fill-opacity="0.30"/>
    <rect x="174" y="46" width="30" height="30" rx="8" fill="#2ee6c5" fill-opacity="0.30"/>
    <!-- row 2 : partial -->
    <rect x="42"  y="90" width="30" height="30" rx="8" fill="#2ee6c5" fill-opacity="0.18"/>
    <rect x="86"  y="90" width="30" height="30" rx="8" fill="#2ee6c5" fill-opacity="0.18"/>
    <rect x="130" y="90" width="30" height="30" rx="8" fill="none" stroke="#31456b" stroke-width="3"/>
    <rect x="174" y="90" width="30" height="30" rx="8" fill="none" stroke="#31456b" stroke-width="3"/>
    <!-- rows 3-4 : open -->
    <rect x="42"  y="134" width="30" height="30" rx="8" fill="none" stroke="#31456b" stroke-width="3"/>
    <rect x="86"  y="134" width="30" height="30" rx="8" fill="none" stroke="#31456b" stroke-width="3"/>
    <rect x="130" y="134" width="30" height="30" rx="8" fill="none" stroke="#31456b" stroke-width="3"/>
    <rect x="174" y="134" width="30" height="30" rx="8" fill="none" stroke="#31456b" stroke-width="3"/>
    <rect x="42"  y="178" width="30" height="30" rx="8" fill="none" stroke="#31456b" stroke-width="3"/>
    <rect x="86"  y="178" width="30" height="30" rx="8" fill="none" stroke="#31456b" stroke-width="3"/>
    <rect x="130" y="178" width="30" height="30" rx="8" fill="none" stroke="#31456b" stroke-width="3"/>
    <rect x="174" y="178" width="30" height="30" rx="8" fill="none" stroke="#31456b" stroke-width="3"/>
  </g>

  <!-- The mark that has to survive 16px: a single bold check. -->
  <path d="M58 138 L104 184 L198 74"
        fill="none" stroke="#080c15" stroke-width="44"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M58 138 L104 184 L198 74"
        fill="none" stroke="url(#mark)" stroke-width="28"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#bloom)"/>
</svg>
